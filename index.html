
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARoundYou - Real AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

  <div id="homeScreen">
  <h1>Bem-vindo ao ARoundYou</h1>
  <p>Descubra pontos de interesse ao seu redor com realidade aumentada.</p>
  <img src="https://img.freepik.com/premium-photo/maps-point-interest-realistic-3d-gps-location-markers-icons-business-destination-flat_817921-72852.jpg" alt="Exploring POIs" class="fullscreen-image" />
  <button id="startBtn" class="start-button">▶️ Iniciar</button>
</div>


<div class="fab-container">
  <div class="fab-wrapper">
    <button class="fab" id="btnLocate">
      <span class="fab-icon">📍</span>
      <span class="fab-label">Localizar</span>
    </button>
  </div>
  <div class="fab-wrapper">
    <button class="fab" id="btnPOIs">
      <span class="fab-icon">📌</span>
      <span class="fab-label">Ver POIs</span>
    </button>
  </div>
  <div class="fab-wrapper">
    <button class="fab" id="toggleViewBtn">
      <span class="fab-icon">🗺️</span>
      <span class="fab-label">Mudar Vista</span>
    </button>
  </div>
</div>




<div id="map"></div>
<div id="cameraContainer">
  <video id="camera" autoplay playsinline muted></video>
  <div id="arOverlay"></div>
  <div id="cameraContainer" class="hidden">
</div>
<div id="cameraError" class="hidden">⚠️ Câmara não disponível</div>


<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="main.js"></script>

</body>
</html>
