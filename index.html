<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>ARoundYou Virtual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Leaflet (for map view) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Botões -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px;">
      <button id="start-button">Start</button>
      <button id="toggle-view" style="display: none;">Mapa</button>
      <button id="view-pois" style="display: none;">Ver POIs</button>
      <button id="center-map" style="display: none;">Centrar</button>
      <button id="switch-mode" style="display: none;">Modo: 3D</button>
    </div>

    <!-- Mapa -->
    <div id="map-view" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;">
      <div id="leaflet-map" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Overlay de debug -->
    <div id="debug-overlay" style="position: absolute; bottom: 0; background: rgba(0,0,0,0.7); color: white; font-size: 12px; padding: 10px; max-height: 150px; overflow-y: auto; z-index: 10;"></div>

    <!-- Cena 3D Virtual -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true;"
      arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-camera
      gps-new-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls-enabled="false"
      raycaster="objects: .clickable"
      cursor="fuse: false; rayOrigin: mouse;"
      ></a-camera>
    </a-scene>


    <!-- Script principal -->
    <script type="module" src="main.js"></script>
  </body>
</html>
