<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARoundYou</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <header class="bg-white shadow p-4 text-center text-2xl font-bold">
    ARoundYou
  </header>

  <main class="p-8 max-w-7xl mx-auto">
    <div class="flex flex-wrap gap-2 mb-6">
      <button id="start-button" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Start</button>
      <button id="switch-mode" class="hidden bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Modo: Mapa</button>
      <button id="toggle-view" class="hidden bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Alternar Vista</button>
      <button id="center-map" class="hidden bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Centrar Mapa</button>
      <button id="view-pois" class="hidden bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Ver POIs</button>
      <button id="camera-button" class="hidden bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition">Ativar Câmara</button>
    </div>

    <video id="camera-preview" autoplay playsinline class="hidden w-full max-w-xl rounded-xl mb-6"></video>

    <div id="map-view" class="hidden h-[70vh] mb-6 rounded-xl shadow-md"></div>

    <div id="poi-list" class="hidden bg-white shadow-md rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Pontos de Interesse</h2>
      <ul id="poi-items" class="list-disc list-inside text-blue-700 space-y-1"></ul>
    </div>

    <pre id="debug-overlay" class="text-sm text-gray-500 mt-4"></pre>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
