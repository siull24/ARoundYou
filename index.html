<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>POIs em AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #map-view,
    #camera-preview {
      width: 100%;
      height: 100vh;
      display: none;
    }

    button {
      position: relative;
      z-index: 1000;
      margin: 4px;
    }

    #debug-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0,0,0,0.7);
      color: lime;
      font-size: 12px;
      padding: 5px;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <button id="start-button">Start</button>
  <button id="switch-mode" style="display:none;">Modo: Mapa</button>
  <button id="camera-button" style="display:none;">Ativar AR</button>

  <div id="map-view"></div>
  <video id="camera-preview" autoplay muted playsinline></video>

  <pre id="debug-overlay"></pre>

  <!-- AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; gpsMinAccuracy: 100;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    device-orientation-permission-ui="enabled: true"
    style="position:absolute; top:0; left:0; width:100%; height:100%; display:none; z-index:10;"
    id="ar-scene">

    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>

  <!-- LIBRARIAS (ORDEM IMPORTANTE) -->

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- TEU SCRIPT -->
  <script type="module" src="main.js"></script>

</body>
</html>
