
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARoundYou - Real AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<div class="fab-container">
  <button id="startBtn" class="fab">
    ▶️<span class="fab-label">Iniciar</span>
  </button>
  <button id="locateBtn" class="fab">
    📍<span class="fab-label">Localizar</span>
  </button>
  <button id="toggleViewBtn" class="fab">
    🔄<span class="fab-label">Mudar Vista</span>
  </button>
</div>




<div id="cameraContainer">
  <video id="camera" autoplay playsinline></video>
  <div id="arOverlay"></div>
  <div id="cameraContainer" class="hidden">
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="main.js"></script>

</body>
</html>
